<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Milewise makes long-distance family travel comfortable, safe and simple.">
	<title>Milewise | Go farther together</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

		:root {
			--ink: #18241f;
			--muted: #65736b;
			--paper: #f7f6ef;
			--mint: #d8f1df;
			--green: #176b4d;
			--lime: #d8f05e;
			--orange: #ef704f;
			--line: #dfe4db;
			--white: #fffefa;
		}

		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: 'DM Sans', sans-serif;
		}
		a { color: inherit; text-decoration: none; }
		button, input { font: inherit; }
		button { cursor: pointer; }
		.container { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }

		header {
			height: 80px;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		.brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.5px; }
		.brand-mark { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px 10px 10px 3px; color: var(--ink); background: var(--lime); transform: rotate(-8deg); font-size: 17px; }
		nav { display: flex; align-items: center; gap: 30px; color: var(--muted); font-size: 14px; font-weight: 600; }
		nav a:hover { color: var(--green); }
		.nav-actions { display: flex; align-items: center; gap: 19px; }
		.login { color: var(--green); font-weight: 700; font-size: 14px; }
		.nav-cta, .primary { border: 0; color: var(--white); background: var(--green); border-radius: 8px; font-weight: 700; padding: 13px 19px; transition: transform .2s, background .2s; }
		.nav-cta:hover, .primary:hover { background: #0f583e; transform: translateY(-2px); }

		.hero { display: grid; grid-template-columns: .95fr 1.05fr; gap: 42px; align-items: center; padding: 58px 0 72px; }
		.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--green); text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; }
		.eyebrow i { display: block; width: 30px; height: 2px; background: var(--orange); }
		h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -1.8px; margin: 0; }
		h1 { max-width: 570px; margin: 16px 0 19px; font-size: clamp(44px, 5.4vw, 70px); line-height: .99; }
		h1 span { color: var(--orange); }
		.hero-copy { max-width: 440px; color: var(--muted); font-size: 17px; line-height: 1.65; }
		.mini-trust { display: flex; align-items: center; gap: 12px; margin-top: 25px; color: var(--muted); font-size: 12px; }
		.avatars { display: flex; padding-left: 6px; }
		.avatar { width: 29px; height: 29px; border: 2px solid var(--paper); border-radius: 50%; margin-left: -6px; display: grid; place-items: center; font-size: 14px; }
		.avatar:nth-child(1) { background: #f3c9a7; }.avatar:nth-child(2) { background: #c0dcae; }.avatar:nth-child(3) { background: #b5cce9; }

		.booking-card { position: relative; min-height: 440px; padding: 28px; border-radius: 18px; background: var(--green); overflow: hidden; box-shadow: 0 20px 40px rgba(23,107,77,.13); }
		.booking-card:after { content: ''; position: absolute; width: 390px; height: 390px; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; right: -150px; bottom: -170px; box-shadow: 0 0 0 42px rgba(255,255,255,.04), 0 0 0 84px rgba(255,255,255,.04); }
		.card-heading { position: relative; z-index: 1; color: white; display: flex; justify-content: space-between; align-items: start; margin-bottom: 22px; }
		.card-heading h2 { font-size: 24px; letter-spacing: -1px; }.card-heading p { margin: 6px 0 0; color: #b9d8c2; font-size: 13px; }
		.round-trip { border: 1px solid rgba(255,255,255,.25); color: white; background: transparent; padding: 8px 10px; border-radius: 6px; font-size: 11px; }
		.route-fields { position: relative; z-index: 1; display: grid; gap: 10px; }
		.field { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 9px; background: white; }
		.field-icon { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: var(--green); background: var(--mint); font-size: 11px; font-weight: 700; }
		.field label { display: block; color: #85918a; font-size: 10px; font-weight: 600; margin-bottom: 2px; }.field input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-weight: 600; font-size: 14px; }
		.field input::placeholder { color: var(--ink); opacity: 1; }
		.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
		.find-button { position: relative; z-index: 1; width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: 8px; color: var(--ink); background: var(--lime); font-weight: 700; transition: transform .2s; }.find-button:hover { transform: translateY(-2px); }
		.form-note { position: relative; z-index: 1; text-align: center; color: #afd0bb; font-size: 11px; margin: 14px 0 0; }

		.strip { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 21px 0; }
		.strip-content { display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 12px; font-weight: 600; }.strip strong { color: var(--ink); font-family: 'Space Grotesk'; font-size: 15px; }
		.perks { display: flex; gap: 34px; }.perk { display: flex; align-items: center; gap: 8px; }.perk b { color: var(--orange); font-size: 18px; }

		.section { padding: 90px 0; }.section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 34px; }.section h2 { font-size: 40px; max-width: 430px; line-height: 1.05; }.section-intro { max-width: 330px; margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
		.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }.step { min-height: 220px; padding: 25px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }.step-number { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--green); background: var(--mint); font-weight: 700; font-size: 12px; }.step h3 { margin: 30px 0 9px; font-size: 20px; letter-spacing: -.7px; }.step p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
		.banner { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; padding: 44px; border-radius: 16px; background: #e7f0d7; overflow: hidden; }.banner h2 { font-size: 37px; max-width: 400px; line-height: 1.05; }.banner p { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 400px; }.banner .primary { display: inline-block; margin-top: 12px; }
		.route-illustration { position: relative; height: 195px; border-radius: 12px; background: #b6d6c1; overflow: hidden; }.route-illustration:before { content: ''; position: absolute; width: 150%; height: 75px; left: -24%; bottom: -8px; background: var(--green); transform: rotate(-10deg); }.route-illustration:after { content: '✦  ✦  ✦'; position: absolute; color: rgba(255,255,255,.55); letter-spacing: 28px; font-size: 12px; top: 37px; left: 30px; }.car { position: absolute; z-index: 1; left: 43%; bottom: 40px; width: 100px; height: 40px; border-radius: 18px 23px 8px 8px; background: var(--orange); }.car:before { content: ''; position: absolute; top: -18px; left: 22px; width: 52px; height: 25px; border-radius: 20px 20px 3px 3px; background: var(--orange); }.car:after { content: '●    ●'; position: absolute; bottom: -9px; left: 12px; color: var(--ink); letter-spacing: 31px; font-size: 14px; }

		footer { padding: 28px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }.footer-inner { display: flex; justify-content: space-between; }.footer-links { display: flex; gap: 22px; }
		.toast { position: fixed; bottom: 22px; left: 50%; z-index: 5; opacity: 0; pointer-events: none; transform: translate(-50%, 15px); padding: 14px 18px; border-radius: 8px; color: white; background: var(--ink); font-size: 13px; transition: .3s; }.toast.show { opacity: 1; transform: translate(-50%, 0); }
		@media (max-width: 760px) { .container { width: min(100% - 32px, 600px); } header { height: 68px; } nav, .login { display: none; } .nav-actions { margin-left: auto; }.nav-cta { padding: 10px 13px; font-size: 12px; } .hero { grid-template-columns: 1fr; gap: 36px; padding: 48px 0 55px; } h1 { font-size: 49px; } .booking-card { min-height: 0; padding: 21px; } .strip-content, .section-head, .footer-inner { align-items: start; flex-direction: column; } .perks { flex-wrap: wrap; gap: 15px 22px; } .section { padding: 65px 0; }.section h2 { font-size: 34px; }.section-intro { margin-top: 18px; }.steps, .banner { grid-template-columns: 1fr; }.step { min-height: 185px; }.step h3 { margin-top: 22px; }.banner { padding: 27px; }.banner h2 { font-size: 31px; }.route-illustration { order: -1; height: 160px; }.footer-inner { gap: 15px; } }
	</style>
</head>
<body>
	<div id="root"></div>
	<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
	<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<script type="text/babel">
		const { useState } = React;

		function Toast({ message }) {
			return <div className={`toast ${message ? 'show' : ''}`}>{message}</div>;
		}

		function BookingCard({ notify }) {
			const [tripType, setTripType] = useState('Round trip');
			const [form, setForm] = useState({ pickup: '', dropoff: '', date: '', passengers: '4' });

			function updateField(event) {
				setForm({ ...form, [event.target.name]: event.target.value });
			}

			function submitBooking(event) {
				event.preventDefault();
				notify(`Great choice. We are finding your best matches for ${form.passengers} passengers.`);
			}

			return <form className="booking-card" onSubmit={submitBooking}>
				<div className="card-heading"><div><h2>Plan your journey</h2><p>Find your family’s perfect ride</p></div><button type="button" className="round-trip" onClick={() => setTripType(tripType === 'Round trip' ? 'One way' : 'Round trip')}>{tripType}</button></div>
				<div className="route-fields">
					<div className="field"><span className="field-icon">A</span><div><label>Pick-up</label><input name="pickup" value={form.pickup} onChange={updateField} required placeholder="Enter your starting point" /></div></div>
					<div className="field"><span className="field-icon">B</span><div><label>Drop-off</label><input name="dropoff" value={form.dropoff} onChange={updateField} required placeholder="Where are you headed?" /></div></div>
					<div className="field-row"><div className="field"><span className="field-icon">▣</span><div><label>Departure</label><input name="date" value={form.date} onChange={updateField} type="date" required /></div></div><div className="field"><span className="field-icon">♧</span><div><label>Passengers</label><input name="passengers" value={form.passengers} onChange={updateField} type="number" min="1" max="8" required /></div></div></div>
				</div>
				<button className="find-button" type="submit">See available drivers <span>→</span></button>
				<p className="form-note">No payment required to browse</p>
			</form>;
		}

		function App() {
			const [toast, setToast] = useState('');
			function notify(message) { setToast(message); window.setTimeout(() => setToast(''), 2600); }
			return <>
				<header className="container"><a className="brand" href="#top"><span className="brand-mark">↗</span> milewise</a><nav><a href="#how-it-works">How it works</a><a href="#safety">Safety</a><a href="#drive">Drive with us</a></nav><div className="nav-actions"><a className="login" href="#">Log in</a><button className="nav-cta" onClick={() => notify('Sign up is coming soon')}>Create account</button></div></header>
				<main id="top"><section className="hero container"><div><div className="eyebrow"><i></i> Long trips, made personal</div><h1>Go farther.<br /><span>Stay together.</span></h1><p className="hero-copy">A comfortable car and a trusted driver for the family journeys that matter. Door-to-door, with room for everyone and everything.</p><div className="mini-trust"><div className="avatars"><span className="avatar">🙂</span><span className="avatar">👩🏽</span><span className="avatar">👨🏻</span></div> Loved by 12,000+ travelling families</div></div><BookingCard notify={notify} /></section>
				<div className="strip"><div className="container strip-content"><strong>Your people. Your pace.</strong><div className="perks"><span className="perk"><b>✓</b> Verified drivers</span><span className="perk"><b>⌁</b> Spacious cars</span><span className="perk"><b>♡</b> Flexible stops</span></div></div></div>
				<section className="section container" id="how-it-works"><div className="section-head"><h2>Travel should feel like the destination.</h2><p className="section-intro">From the first hello to the final drop-off, Milewise puts the comfort of your family first.</p></div><div className="steps"><article className="step"><span className="step-number">01</span><h3>Tell us the plan</h3><p>Share your route, date and crew. We’ll show you drivers and cars that fit your trip.</p></article><article className="step"><span className="step-number">02</span><h3>Meet your match</h3><p>Compare profiles, reviews and clear prices. Chat before you book so everyone feels good.</p></article><article className="step"><span className="step-number">03</span><h3>Enjoy the ride</h3><p>Settle in, make a stop, play your playlist. Your driver handles the road, you make the memories.</p></article></div></section>
				<section className="container" id="safety"><div className="banner"><div><div className="eyebrow"><i></i> Peace of mind included</div><h2>More than a ride. A little room to breathe.</h2><p>Every Milewise driver is background-checked, reviewed by real families and trained to make long-distance travel feel easy.</p><a className="primary" href="#">Our safety promise&nbsp; →</a></div><div className="route-illustration"><div className="car"></div></div></div></section></main>
				<footer><div className="container footer-inner"><span>© 2026 Milewise</span><div className="footer-links"><a href="#">Help</a><a href="#">Terms</a><a href="#">Privacy</a></div></div></footer><Toast message={toast} />
			</>;
		}

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
</body>
</html>
